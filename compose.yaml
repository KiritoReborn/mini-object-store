x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).close()"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: controller
    ports: ["127.0.0.1:8000:8000"]
    volumes: [controller_data:/data]
    environment:
      ARTAUD_API_KEY: ${ARTAUD_API_KEY:-}
      ARTAUD_ALLOWED_ORIGINS: ${ARTAUD_ALLOWED_ORIGINS:-}

  worker1:
    <<: *worker
    container_name: worker1
    environment:
      WORKER_ID: worker1
      CONTROLLER_URL: ${CONTROLLER_URL:-http://controller:8000}
    volumes: [worker1_data:/data]

  worker2:
    <<: *worker
    container_name: worker2
    environment:
      WORKER_ID: worker2
      CONTROLLER_URL: ${CONTROLLER_URL:-http://controller:8000}
    volumes: [worker2_data:/data]

  worker3:
    <<: *worker
    container_name: worker3
    environment:
      WORKER_ID: worker3
      CONTROLLER_URL: ${CONTROLLER_URL:-http://controller:8000}
    volumes: [worker3_data:/data]

  worker4:
    <<: *worker
    container_name: worker4
    environment:
      WORKER_ID: worker4
      CONTROLLER_URL: ${CONTROLLER_URL:-http://controller:8000}
    volumes: [worker4_data:/data]

volumes:
  controller_data:
  worker1_data:
  worker2_data:
  worker3_data:
  worker4_data:
